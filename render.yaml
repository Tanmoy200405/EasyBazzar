services:
  # Backend API
  - type: web
    name: easybazzar-1
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  # Frontend Storefront
  - type: static
    name: easy-bazzar-frontend
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_BACKEND_URL
        value: https://easybazzar-1.onrender.com

  # Admin Panel
  - type: static
    name: easy-bazzar-admin
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: admin
    envVars:
      - key: VITE_BACKEND_URL
        value: https://easybazzar-1.onrender.com
